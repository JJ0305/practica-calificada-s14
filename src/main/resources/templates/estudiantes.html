<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gestión Académica</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-body-tertiary">

<nav class="navbar navbar-expand-lg bg-body border-bottom mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/estudiantes}">
            <i class="bi bi-mortarboard-fill text-primary me-2"></i>SistemaGestiónAcadémica
        </a>
        <span class="badge text-bg-secondary">Spring Boot + CI/CD Ready</span>
    </div>
</nav>

<div class="container">
    <!-- Alertas de Operación -->
    <div th:if="${exito}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i><span th:text="${exito}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${errorNegocio}" class="alert alert-warning alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-circle-fill me-2"></i><span th:text="${errorNegocio}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="row g-4">
        <!-- Formulario Registro / Edición -->
        <div class="col-lg-4">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-primary text-white fw-semibold">
                    <i class="bi bi-person-plus-fill me-1" th:if="${estudiante.id == null}"></i>
                    <i class="bi bi-pencil-square me-1" th:if="${estudiante.id != null}"></i>
                    <span th:text="${estudiante.id == null ? 'Registrar Estudiante' : 'Actualizar Estudiante'}"></span>
                </div>
                <div class="card-body">
                    <form th:action="@{/estudiantes/guardar}" th:object="${estudiante}" method="post" novalidate>
                        <input type="hidden" th:field="*{id}"/>

                        <div class="mb-3">
                            <label class="form-label">Código Universitario</label>
                            <input type="text" th:field="*{codigo}" class="form-control"
                                   th:classappend="${#fields.hasErrors('codigo')} ? 'is-invalid'"
                                   placeholder="Ej. U20261045">
                            <div class="invalid-feedback" th:errors="*{codigo}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Nombres</label>
                            <input type="text" th:field="*{nombres}" class="form-control"
                                   th:classappend="${#fields.hasErrors('nombres')} ? 'is-invalid'"
                                   placeholder="Ej. Carlos Alberto">
                            <div class="invalid-feedback" th:errors="*{nombres}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Apellidos</label>
                            <input type="text" th:field="*{apellidos}" class="form-control"
                                   th:classappend="${#fields.hasErrors('apellidos')} ? 'is-invalid'"
                                   placeholder="Ej. Mendoza Ruiz">
                            <div class="invalid-feedback" th:errors="*{apellidos}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Correo Institucional</label>
                            <input type="email" th:field="*{correo}" class="form-control"
                                   th:classappend="${#fields.hasErrors('correo')} ? 'is-invalid'"
                                   placeholder="alumno@universidad.edu.pe">
                            <div class="invalid-feedback" th:errors="*{correo}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Carrera</label>
                            <select th:field="*{carrera}" class="form-select"
                                    th:classappend="${#fields.hasErrors('carrera')} ? 'is-invalid'">
                                <option value="">Seleccione una carrera...</option>
                                <option value="Ingeniería de Sistemas">Ingeniería de Sistemas</option>
                                <option value="Ingeniería de Software">Ingeniería de Software</option>
                                <option value="Ingeniería Industrial">Ingeniería Industrial</option>
                                <option value="Administración de Empresas">Administración de Empresas</option>
                                <option value="Contabilidad">Contabilidad</option>
                            </select>
                            <div class="invalid-feedback" th:errors="*{carrera}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Semestre</label>
                            <input type="number" th:field="*{semestre}" min="1" max="14" class="form-control"
                                   th:classappend="${#fields.hasErrors('semestre')} ? 'is-invalid'"
                                   placeholder="1 - 14">
                            <div class="invalid-feedback" th:errors="*{semestre}"></div>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-save me-1"></i>
                                <span th:text="${estudiante.id == null ? 'Guardar Registro' : 'Actualizar Datos'}"></span>
                            </button>
                            <a th:if="${estudiante.id != null}" th:href="@{/estudiantes}" class="btn btn-outline-secondary">
                                Cancelar Edición
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <!-- Buscador y Listado -->
        <div class="col-lg-8">
            <div class="card shadow-sm border-0">
                <div class="card-header d-flex justify-content-between align-items-center flex-wrap gap-2">
                    <span class="fw-semibold"><i class="bi bi-people-fill me-1"></i>Estudiantes Registrados</span>
                    <form th:action="@{/estudiantes}" method="get" class="d-flex gap-2">
                        <input type="text" name="filtro" th:value="${filtro}" class="form-control form-control-sm"
                               placeholder="Buscar por código, nombre o carrera...">
                        <button type="submit" class="btn btn-sm btn-outline-primary">
                            <i class="bi bi-search"></i>
                        </button>
                        <a th:if="${filtro != null and !filtro.isEmpty()}" th:href="@{/estudiantes}"
                           class="btn btn-sm btn-outline-secondary" title="Limpiar filtro">
                            <i class="bi bi-x-lg"></i>
                        </a>
                    </form>
                </div>

                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-dark">
                                <tr>
                                    <th>ID</th>
                                    <th>Código</th>
                                    <th>Estudiante</th>
                                    <th>Correo</th>
                                    <th>Carrera</th>
                                    <th class="text-center">Sem.</th>
                                    <th class="text-end">Acciones</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:if="${#lists.isEmpty(estudiantes)}">
                                    <td colspan="7" class="text-center py-4 text-muted">
                                        No se encontraron estudiantes registrados.
                                    </td>
                                </tr>
                                <tr th:each="est : ${estudiantes}">
                                    <td th:text="${est.id}"></td>
                                    <td><span class="badge text-bg-info" th:text="${est.codigo}"></span></td>
                                    <td th:text="${est.nombres + ' ' + est.apellidos}"></td>
                                    <td th:text="${est.correo}" class="small"></td>
                                    <td th:text="${est.carrera}" class="small"></td>
                                    <td class="text-center" th:text="${est.semestre}"></td>
                                    <td class="text-end">
                                        <a th:href="@{/estudiantes/editar/{id}(id=${est.id})}"
                                           class="btn btn-sm btn-outline-warning" title="Editar">
                                            <i class="bi bi-pencil"></i>
                                        </a>
                                        <a th:href="@{/estudiantes/eliminar/{id}(id=${est.id})}"
                                           class="btn btn-sm btn-outline-danger" title="Eliminar"
                                           onclick="return confirm('¿Seguro que deseas eliminar este estudiante?');">
                                            <i class="bi bi-trash"></i>
                                        </a>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
